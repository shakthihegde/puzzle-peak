<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Puzzle Peak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Ad-free gifted-test practice: CogAT, CCAT, OLSAT, NNAT, ISEE and math-contest style questions with explanations.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one centred column (max 980px) of stacked bands; question screens are a single card with a sticky progress bar. */
:root {
  --bg: #eef2f8; --surface: #ffffff; --raise: #f7f9fc; --ink: #1b2440; --muted: #5d6680; --line: #dbe1ec; --soft: #e6ecf6;
  --sun: #f5b400; --sun-ink: #3b2a00; --sun-soft: #fff1c7;
  --good: #1f9d6a; --good-soft: #dcf5ea; --bad: #d8553d; --bad-soft: #fde5df;
  --verbal: #e0613f; --quant: #138e96; --figural: #3f6be0; --spatial: #6a9a1f;
  --owl: #1e8f96; --owl-belly: #cdeceb;
  --shadow: 0 1px 2px rgba(27, 36, 64, .06), 0 6px 20px rgba(27, 36, 64, .07);
  --f-display: "Fredoka", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Lexend", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1527; --surface: #182039; --raise: #1d2643; --ink: #edf1f9; --muted: #a0a9c2; --line: #2b3557; --soft: #222c4b;
  --sun: #ffc531; --sun-ink: #2a1e00; --sun-soft: #3a3115;
  --good: #3cc98f; --good-soft: #143a2c; --bad: #ff7d63; --bad-soft: #43221d;
  --verbal: #ff8a66; --quant: #36c2c9; --figural: #7d9cff; --spatial: #9bcc4a;
  --owl: #38b7bd; --owl-belly: #1f4a4c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1527; --surface: #182039; --raise: #1d2643; --ink: #edf1f9; --muted: #a0a9c2; --line: #2b3557; --soft: #222c4b;
  --sun: #ffc531; --sun-ink: #2a1e00; --sun-soft: #3a3115;
  --good: #3cc98f; --good-soft: #143a2c; --bad: #ff7d63; --bad-soft: #43221d;
  --verbal: #ff8a66; --quant: #36c2c9; --figural: #7d9cff; --spatial: #9bcc4a;
  --owl: #38b7bd; --owl-belly: #1f4a4c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font: 400 16px/1.5 var(--f-body); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 6px; }
a { color: var(--figural); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 4.5vw, 2.4rem); }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.08rem; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: grid; gap: 14px; }
[hidden] { display: none !important; }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; font: 600 1.25rem var(--f-display); }
.brand svg { width: 36px; height: 36px; }
.lvl { display: flex; align-items: center; gap: 8px; margin-left: auto; min-width: 0; }
.lvl-badge { font: 600 .82rem var(--f-display); background: var(--sun); color: var(--sun-ink); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.xpbar { width: 90px; height: 8px; border-radius: 9px; background: var(--soft); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--sun); border-radius: 9px; transition: width .6s cubic-bezier(.2, .9, .3, 1.2); }
.iconbtn { border: 1px solid var(--line); background: var(--raise); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }
.flame { display: inline-flex; align-items: center; gap: 2px; font: 600 .9rem var(--f-display); color: var(--verbal); }
.flame svg { width: 18px; height: 18px; }
@media (max-width: 520px) { .xpbar { display: none; } .brand span { display: none; } }

/* ---------- home ---------- */
main { padding-block: 22px 60px; }
.hello { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; background: var(--surface); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.hello .owl { width: 92px; height: 92px; }
.hello h1 { margin-bottom: 4px; }
.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 14px; }
.qcard { text-align: left; border: 1px solid var(--line); background: var(--raise); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
.qcard b { font: 600 1.02rem var(--f-display); }
.qcard.hot { background: var(--sun-soft); border-color: transparent; }
.qcard:hover { border-color: var(--muted); }
.section { margin-top: 30px; }
.section-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.section-head .grp-dot { width: 14px; height: 14px; border-radius: 4px; background: var(--g); flex: none; align-self: center; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 12px; }
.tile { text-align: left; border: 0; background: var(--surface); border-radius: 12px; padding: 14px; display: grid; gap: 6px; box-shadow: var(--shadow); transition: transform .15s ease; }
.tile:hover { transform: translateY(-2px); }
.tile.locked { opacity: .7; }
.tile.locked:hover { transform: none; }
.climb { margin-top: 14px; background: var(--surface); border: 2px solid var(--sun); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.climb .owl { width: 64px; height: 64px; }
.mixmap { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 4px; max-width: 560px; }
.mixmap button { aspect-ratio: 1; border: 0; padding: 0; border-radius: 4px; background: var(--soft); }
.mixmap .s1 { background: var(--sun-soft); } .mixmap .s2 { background: color-mix(in srgb, var(--sun) 55%, var(--sun-soft)); } .mixmap .s3 { background: var(--sun); }
.mixmap .cur { outline: 2px solid var(--ink); outline-offset: 1px; }
@media (max-width: 520px) { .mixmap { grid-template-columns: repeat(10, minmax(0, 1fr)); } }
.tile .ttl { font: 600 1.05rem var(--f-display); }
.tile .tag { font-size: .74rem; color: var(--muted); letter-spacing: .02em; }
.tile .meta { display: flex; justify-content: space-between; align-items: center; font-size: .84rem; color: var(--muted); }
.stars { color: var(--sun); letter-spacing: 1px; font-size: .95rem; white-space: nowrap; }
.stars .off { color: var(--line); }
.prog { height: 6px; border-radius: 6px; background: var(--soft); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--g, var(--sun)); border-radius: 6px; }
.tests { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.tcard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px; display: grid; gap: 6px; align-content: start; }
.tcard .ttl { font: 600 1.08rem var(--f-display); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip-s { font-size: .74rem; border-radius: 999px; padding: 2px 9px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.chip-s.full { background: var(--sun-soft); color: var(--ink); }

/* ---------- chapter ---------- */
.back { border: 0; background: none; color: var(--muted); padding: 0; display: inline-flex; gap: 6px; align-items: center; margin-bottom: 12px; }
.chead { display: grid; gap: 8px; }
.tipbox { background: var(--surface); border-radius: var(--r); padding: 14px 16px; border: 1px dashed var(--g, var(--line)); }
.tipbox b { font-family: var(--f-display); font-weight: 600; }
.sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.setbtn { border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 12px; padding: 12px; display: grid; gap: 4px; text-align: left; }
.setbtn b { font: 600 1.05rem var(--f-display); }
.setbtn .lv { font-size: .75rem; color: var(--muted); }
.setbtn.done { background: var(--raise); }
.endless { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 12px; font-size: .9rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

.btn { border: 0; border-radius: 12px; padding: 12px 18px; font: 600 1rem var(--f-display); background: var(--ink); color: var(--surface); display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn.sun { background: var(--sun); color: var(--sun-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.good { background: var(--good); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }

/* ---------- quiz ---------- */
.qbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--bg); padding-block: 10px; }
.qbar .row { flex-wrap: nowrap; }
.qprog { flex: 1; height: 10px; border-radius: 10px; background: var(--soft); overflow: hidden; display: flex; gap: 2px; }
.qprog i { flex: 1; background: var(--line); }
.qprog i.ok { background: var(--good); } .qprog i.no { background: var(--bad); } .qprog i.cur { background: var(--sun); }
.timer { font: 600 1rem var(--f-display); font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; }
.timer.low { color: var(--bad); }
.qcardx { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: clamp(14px, 3vw, 26px); display: grid; gap: 16px; }
.qhead { display: flex; justify-content: space-between; gap: 10px; font-size: .8rem; color: var(--muted); }
.prompt { font-size: 1.12rem; line-height: 1.5; }
.prompt b { font-weight: 600; }
.stem { overflow-x: auto; }
.opts { display: grid; gap: 10px; }
.opts.text { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.opts.figs { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.opts.figs.n4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 560px) { .opts.figs, .opts.figs.n4 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .opts.figs.n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.opt { position: relative; border: 2px solid var(--line); background: var(--raise); border-radius: 12px; padding: 12px 14px 12px 44px; text-align: left; font-size: 1.05rem; min-height: 54px; transition: border-color .15s, transform .12s; }
.opts.figs .opt { padding: 26px 8px 8px; display: grid; place-items: center; }
.opt .L { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 7px; background: var(--soft); display: grid; place-items: center; font: 600 .8rem var(--f-display); color: var(--muted); }
.opts.figs .opt .L { top: 7px; left: 7px; transform: none; }
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt:active:not(:disabled) { transform: scale(.98); }
.opt:disabled { cursor: default; }
.opt.sel { border-color: var(--figural); background: var(--soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .L { background: var(--good); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .L { background: var(--bad); color: #fff; }
.opt.dim { opacity: .55; }
.pop { animation: pop .35s cubic-bezier(.2, 1.6, .4, 1); }
.shake { animation: shake .4s; }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.06); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
.feedback { border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; animation: rise .3s ease; }
.feedback.ok { background: var(--good-soft); }
.feedback.no { background: var(--bad-soft); }
.feedback h3 { display: flex; align-items: center; gap: 8px; }
.feedback .why { font-weight: 500; }
.feedback .how { background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.feedback .how p { margin: 4px 0; }
.feedback summary { cursor: pointer; font-weight: 500; }
.work { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.gap { color: var(--muted); font-size: .85em; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.xpfloat { position: fixed; pointer-events: none; font: 700 1.2rem var(--f-display); color: var(--sun); text-shadow: 0 1px 0 rgba(0, 0, 0, .15); animation: floatup 1s ease forwards; z-index: 30; }
@keyframes floatup { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-50px); } }
.qfoot { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }

/* stems */
.seq { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-width: 52px; padding: 10px 12px; border-radius: 10px; background: var(--soft); font: 600 1.25rem var(--f-display); text-align: center; font-variant-numeric: tabular-nums; }
.chip.q, .word.q, .q { color: var(--bad); }
.seq.letters .chip { letter-spacing: .06em; }
.pairs { display: flex; flex-wrap: wrap; gap: 12px; font: 600 1.25rem var(--f-display); font-variant-numeric: tabular-nums; }
.pair { background: var(--soft); border-radius: 10px; padding: 8px 12px; white-space: nowrap; }
.eq, .eqs { font: 600 1.4rem var(--f-display); font-variant-numeric: tabular-nums; }
.eqs { display: grid; gap: 6px; background: var(--soft); border-radius: 12px; padding: 12px 16px; justify-self: start; }
.ngrid { display: inline-grid; grid-template-columns: repeat(var(--cols), 64px); gap: 6px; }
.ngrid span { height: 56px; border-radius: 10px; background: var(--soft); display: grid; place-items: center; font: 600 1.25rem var(--f-display); font-variant-numeric: tabular-nums; }
.ngrid span.q { background: var(--sun-soft); }
.ngrid .blank { background: transparent; border: 2px dashed var(--line); }
.pyr { display: grid; gap: 6px; justify-items: center; }
.pyr div { display: flex; gap: 6px; }
.pyr span { width: 58px; height: 46px; border-radius: 8px; background: var(--soft); display: grid; place-items: center; font: 600 1.15rem var(--f-display); font-variant-numeric: tabular-nums; }
.pyr span.q { background: var(--sun-soft); }
.analogy, .wordset { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.word { background: var(--soft); border-radius: 10px; padding: 8px 14px; font: 500 1.2rem var(--f-display); }
.analogy .arr { color: var(--muted); font-size: 1.2rem; }
.analogy .sep { width: 18px; }
.wordset.one .word { font-size: 1.5rem; padding: 10px 20px; }
.sentence { font-size: 1.2rem; margin: 0; line-height: 1.7; }
.sentence .blank { display: inline-block; min-width: 80px; border-bottom: 2.5px solid var(--ink); color: transparent; }
.code { font: 600 1.1rem ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .12em; }
.big-letter { font: 600 1.5rem var(--f-display); }
.diagram { max-width: 260px; width: 100%; height: auto; }
.diagram.sm { max-width: 150px; }
.diagram.iso { max-width: 240px; }
.topview { border-collapse: collapse; margin: 6px 0; }
.topview td { width: 34px; height: 34px; text-align: center; border: 2px solid var(--line); font: 600 1rem var(--f-display); background: var(--surface); }
.fr { display: inline-flex; align-items: baseline; gap: 1px; white-space: nowrap; }
.fr sup, .fr sub { font-size: .78em; }

/* figure tiles: always "paper" so black/white/striped read like a printed booklet */
.fig { width: 100%; height: auto; display: block; aspect-ratio: 1; max-width: 100%; }
.cell { background: #fff; border-radius: 10px; border: 1.5px solid #cfd6e3; padding: 4px; width: 100%; max-width: 120px; aspect-ratio: 1; display: grid; place-items: center; }
.cell.q { border-style: dashed; border-color: var(--bad); }
.opts.figs .opt .fig { background: #fff; border-radius: 8px; max-width: 110px; }
.mx2 { display: grid; grid-template-columns: minmax(0, 120px) 28px minmax(0, 120px); gap: 10px 6px; align-items: center; justify-content: start; }
.mx3 { display: grid; grid-template-columns: repeat(3, minmax(0, 100px)); gap: 6px; background: var(--soft); padding: 8px; border-radius: 12px; justify-content: start; width: max-content; max-width: 100%; }
.mx3 .cell { max-width: 100px; }
.srow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.srow .cell { width: 100px; flex: none; }
.srow.ex { background: var(--soft); padding: 10px; border-radius: 12px; width: max-content; max-width: 100%; }
.srow.fold .cell { width: 112px; }
.srow.big .cell { width: 190px; max-width: 190px; }
.arr { color: var(--muted); font: 600 1.3rem var(--f-display); text-align: center; }
.bigpat { max-width: 330px; }
.bigpat .fig { background: #fff; border-radius: 10px; border: 1.5px solid #cfd6e3; }
.mirror { width: 6px; height: 100px; border-radius: 3px; background: linear-gradient(90deg, #9fc3e8, #e2f0ff, #9fc3e8); }
@media (max-width: 420px) { .srow .cell { width: 78px; } .srow.fold .cell { width: 86px; } .mx3 { grid-template-columns: repeat(3, minmax(0, 84px)); } }

/* ---------- results ---------- */
.result { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 24px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.result .owl { width: 110px; height: 110px; }
.bigscore { font: 700 3rem var(--f-display); font-variant-numeric: tabular-nums; line-height: 1; }
.bigstars { display: flex; gap: 8px; }
.bigstars svg { width: 48px; height: 48px; }
.bigstars .s-on { animation: starIn .5s cubic-bezier(.2, 1.6, .4, 1) both; }
.bigstars .s-on:nth-child(2) { animation-delay: .25s; } .bigstars .s-on:nth-child(3) { animation-delay: .5s; }
@keyframes starIn { from { transform: scale(0) rotate(-30deg); opacity: 0; } to { transform: none; opacity: 1; } }
.statrow { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
.stat { display: grid; }
.stat b { font: 600 1.3rem var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--muted); }
.review { display: grid; gap: 12px; margin-top: 18px; }
.review details { background: var(--surface); border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow); }
.review summary { cursor: pointer; display: flex; gap: 10px; align-items: center; }
.review summary .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.review .inner { display: grid; gap: 12px; margin-top: 12px; }

/* ---------- test ---------- */
.tnav { display: flex; flex-wrap: wrap; gap: 4px; }
.tnav button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: .8rem; font-variant-numeric: tabular-nums; padding: 0; }
.tnav button.ans { background: var(--soft); }
.tnav button.cur { border: 2px solid var(--ink); }
.tnav button.flag { box-shadow: inset 0 -3px 0 var(--sun); }
.tnav button.ok { background: var(--good-soft); border-color: var(--good); }
.tnav button.no { background: var(--bad-soft); border-color: var(--bad); }
.confirm { background: var(--sun-soft); border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pausecover { background: var(--surface); border-radius: var(--r); padding: 40px 20px; text-align: center; display: grid; gap: 12px; justify-items: center; }
table.plain { border-collapse: collapse; width: 100%; font-size: .92rem; }
table.plain th, table.plain td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.plain td.n, table.plain th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: .78rem; font-weight: 500; }
.pill.good { background: var(--good-soft); color: var(--good); } .pill.mid { background: var(--sun-soft); color: var(--ink); } .pill.low { background: var(--bad-soft); color: var(--bad); }

/* ---------- trophies ---------- */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.badge { background: var(--surface); border-radius: 12px; padding: 14px; text-align: center; display: grid; gap: 6px; justify-items: center; box-shadow: var(--shadow); }
.badge svg { width: 54px; height: 54px; }
.badge.locked { opacity: .45; filter: grayscale(1); box-shadow: none; border: 1px dashed var(--line); }
.badge b { font: 600 .98rem var(--f-display); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); border-radius: 14px; padding: 12px 18px; display: flex; gap: 12px; align-items: center; z-index: 40; box-shadow: var(--shadow); animation: toastIn .45s cubic-bezier(.2, 1.4, .4, 1); max-width: calc(100% - 32px); }
.toast svg { width: 40px; height: 40px; flex: none; }
@keyframes toastIn { from { transform: translate(-50%, 30px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

.form { display: grid; gap: 12px; background: var(--surface); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.form label { display: grid; gap: 4px; font-weight: 500; }
.form textarea { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--raise); font: .78rem ui-monospace, Menlo, monospace; width: 100%; resize: vertical; word-break: break-all; }
.form input[type="text"], .form input[type="password"] { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--raise); }
.prose { max-width: 68ch; }
.prose p, .prose li { color: var(--ink); }
.prose ul { padding-left: 20px; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 35; width: 100%; height: 100%; }
.owl .pupils { transform-origin: 60px 54px; animation: blink 5s infinite; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

</style>
<div id="app"></div>
<noscript><p style="padding:20px">Puzzle Peak needs JavaScript turned on.</p></noscript>
<script>
'use strict';
// Core: seeded randomness, question registry, set building.
const PP = (typeof window !== 'undefined' ? window : globalThis).PP = { chapters: [], byId: {}, tests: [], testById: {} };

PP.groups = [
  { id: 'verbal', name: 'Words', blurb: 'Analogies, sentences, word groups, codes' },
  { id: 'quant', name: 'Numbers', blurb: 'Series, number puzzles, word problems, contest math' },
  { id: 'figural', name: 'Shapes & Patterns', blurb: 'Matrices, series, classification, paper folding' },
  { id: 'spatial', name: 'Space & Logic', blurb: 'Rotation, cubes, nets, directions, logic' },
];

PP.hash = function (str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^= h >>> 16) >>> 0;
};

PP.rng = function (seed) {
  let a = seed >>> 0;
  const r = function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  r.int = (lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.shuffle = (arr) => {
    const a2 = arr.slice();
    for (let i = a2.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a2[i], a2[j]] = [a2[j], a2[i]]; }
    return a2;
  };
  r.sample = (arr, n) => r.shuffle(arr).slice(0, n);
  r.chance = (p) => r() < p;
  r.sign = () => (r() < 0.5 ? -1 : 1);
  return r;
};

// ---------- small helpers ----------
PP.esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
PP.gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
PP.lcm = (a, b) => (a / PP.gcd(a, b)) * b;
PP.isPrime = (n) => { if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
PP.range = (n) => Array.from({ length: n }, (_, i) => i);
PP.sum = (a) => a.reduce((x, y) => x + y, 0);
PP.fmt = (n) => {
  if (typeof n !== 'number') return String(n);
  const s = Number.isInteger(n) ? String(n) : String(Math.round(n * 1000) / 1000);
  return s.replace(/^-/, '−').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
};
PP.money = (c) => '$' + (c / 100).toFixed(2);
PP.frac = (n, d) => {
  if (d < 0) { n = -n; d = -d; }
  const g = PP.gcd(n, d) || 1; n /= g; d /= g;
  if (d === 1) return PP.fmt(n);
  return `<span class="fr"><sup>${n}</sup>&frasl;<sub>${d}</sub></span>`;
};
PP.fracKey = (n, d) => { const g = PP.gcd(n, d) || 1; return (n / g) + '/' + (d / g); };
PP.mixed = (n, d) => {
  const g = PP.gcd(n, d); n /= g; d /= g;
  if (n < d || d === 1) return PP.frac(n, d);
  const w = Math.floor(n / d), rem = n % d;
  return rem ? `${w} ${PP.frac(rem, d)}` : String(w);
};
PP.ord = (n) => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');
PP.words = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
PP.cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
PP.plural = (n, w, pl) => n === 1 ? `1 ${w}` : `${PP.fmt(n)} ${pl || w + 's'}`;

PP.NAMES = ['Aarav', 'Maya', 'Liam', 'Zara', 'Noah', 'Priya', 'Leo', 'Ava', 'Ethan', 'Mia', 'Omar', 'Sofia', 'Kai', 'Nina', 'Ravi', 'Emma', 'Jin', 'Lucas', 'Anya', 'Sam', 'Diego', 'Hana', 'Owen', 'Ira', 'Theo', 'Lila', 'Arjun', 'Chloe', 'Felix', 'Rosa'];
PP.names = (r, n) => r.sample(PP.NAMES, n);

// ---------- multiple choice builder ----------
// correct: {h: html, k?: key}; wrongs: [{h, k?, why?}] in priority order.
PP.mc = function (r, correct, wrongs, n) {
  n = n || 5;
  const key = (o) => (o.k !== undefined ? String(o.k) : o.h);
  const seen = new Set([key(correct)]), seenH = new Set([correct.h]);
  const picked = [];
  for (const w of wrongs) {
    if (picked.length >= n - 1) break;
    if (w == null) continue;
    const k = key(w);
    if (seen.has(k) || seenH.has(w.h)) continue;
    seen.add(k); seenH.add(w.h); picked.push(w);
  }
  if (picked.length < n - 1) throw new Error('not enough distractors');
  const all = r.shuffle([Object.assign({}, correct, { ok: true }), ...picked]);
  return { opts: all.map((o) => o.h), ans: all.findIndex((o) => o.ok), why: all.map((o) => o.why || '') };
};

// numeric option helper: values with optional why; keys by value
PP.num = (v, why, fmt) => ({ h: (fmt || PP.fmt)(v), k: 'n' + v, why });
PP.nearMiss = (ans, step) => {
  step = step || 1;
  return [ans + step, ans - step, ans + 2 * step, ans - 2 * step, ans + 3 * step, ans + 10, ans - 10]
    .filter((v) => v >= 0 && v !== ans)
    .map((v) => PP.num(v, 'Close, but not quite. Check the working shown below step by step.'));
};

// ---------- registry ----------
PP.addChapter = function (c) {
  c.nOpts = c.nOpts || 5;
  if (c.bank) {
    c.order = PP.range(c.bank.length).sort((a, b) => (c.bank[a].d - c.bank[b].d) || (PP.hash(c.id + a) - PP.hash(c.id + b)));
  }
  PP.chapters.push(c); PP.byId[c.id] = c;
};

PP.make = function (chId, seed, lvl) {
  const ch = PP.byId[chId];
  if (!ch) throw new Error('unknown chapter ' + chId);
  let q = null, err = null;
  if (ch.bank) {
    const item = ch.bank[seed % ch.bank.length];
    q = ch.fromBank(item, PP.rng(PP.hash(chId + '#' + seed)), seed);
    lvl = item.d;
  } else {
    for (let a = 0; a < 60 && !q; a++) {
      try { q = ch.gen(PP.rng(PP.hash(chId + ':' + seed + ':' + a)), lvl); } catch (e) { err = e; }
    }
  }
  if (!q) throw err || new Error('generation failed ' + chId);
  q.ch = chId; q.seed = seed; q.lvl = lvl; q.id = chId + '~' + seed + '~' + lvl;
  return q;
};

PP.LEVELS = { 1: 'Warm-up', 2: 'Challenge', 3: 'Expert' };
PP.setLevel = (i) => (i < 3 ? 1 : i < 7 ? 2 : 3);
PP.setCount = (ch) => (ch.bank ? Math.ceil(ch.bank.length / 10) : 10);
PP.setLevelOf = (ch, i) => {
  if (!ch.bank) return PP.setLevel(i);
  const items = ch.order.slice(i * 10, i * 10 + 10).map((k) => ch.bank[k].d);
  return Math.round(PP.sum(items) / items.length);
};
PP._setCache = {};
PP.setRefs = function (ch, i) {
  const ck = ch.id + '/' + i;
  if (PP._setCache[ck]) return PP._setCache[ck];
  let refs;
  if (ch.bank) {
    refs = ch.order.slice(i * 10, i * 10 + 10).map((idx) => ({ ch: ch.id, seed: idx, lvl: ch.bank[idx].d }));
  } else {
    refs = []; const seen = new Set(); let k = 0;
    const lvl = PP.setLevel(i);
    while (refs.length < 10 && k < 80) {
      const seed = PP.hash(ch.id + '/set' + i + '/' + k++) % 1000000000;
      const q = PP.make(ch.id, seed, lvl);
      const key = q.prompt + q.stem + q.opts.join('');
      if (seen.has(key)) continue;
      seen.add(key); refs.push({ ch: ch.id, seed, lvl });
    }
  }
  return (PP._setCache[ck] = refs);
};

// pick n refs from a chapter for a test/daily, deterministic by key, ramping difficulty
PP.pickRefs = function (chId, n, key, levels) {
  const ch = PP.byId[chId];
  const refs = [];
  const r = PP.rng(PP.hash(key));
  if (ch.bank) {
    const used = new Set();
    for (let j = 0; j < n; j++) {
      const want = levels ? levels(j, n) : 2;
      let pool = ch.order.filter((k) => !used.has(k) && ch.bank[k].d === want);
      if (!pool.length) pool = ch.order.filter((k) => !used.has(k));
      if (!pool.length) break;
      const idx = r.pick(pool); used.add(idx);
      refs.push({ ch: chId, seed: idx, lvl: ch.bank[idx].d });
    }
  } else {
    const seen = new Set();
    for (let j = 0, k = 0; refs.length < n && k < n * 6; k++) {
      const lvl = levels ? levels(j, n) : 2;
      const seed = PP.hash(key + '/' + k) % 1000000000;
      const q = PP.make(chId, seed, lvl);
      const sk = q.prompt + q.stem + q.opts.join('');
      if (seen.has(sk)) continue;
      seen.add(sk); refs.push({ ch: chId, seed, lvl }); j++;
    }
  }
  return refs;
};
PP.ramp = (j, n) => (j < n * 0.3 ? 1 : j < n * 0.7 ? 2 : 3);
PP.rampHard = (j, n) => (j < n * 0.2 ? 1 : j < n * 0.55 ? 2 : 3);

// Parses compact bank lines: "a | b | c | ..." -> arrays
PP.lines = (txt) => txt.split('\n').map((l) => l.trim()).filter((l) => l && !l.startsWith('#'));

'use strict';
// Figure renderer: shapes drawn into a 100x100 tile. Tiles are always "paper" (light) so
// black / white / striped / grey read the same way they do in a printed test booklet.
(function () {
  const F = (PP.fig = {});
  const INK = '#1b2440', PAPER = '#ffffff', GREY = '#a3abbd';
  F.INK = INK; F.PAPER = PAPER;
  F.FILL = { w: PAPER, b: INK, h: 'url(#pp-hatch)', g: GREY, d: 'url(#pp-dots)' };
  F.fillName = { w: 'white', b: 'black', h: 'striped', g: 'grey', d: 'dotted' };
  F.FILLS = ['w', 'b', 'h', 'g'];

  const poly = (pts) => [['M', ...pts[0]], ...pts.slice(1).map((p) => ['L', ...p]), ['Z']];
  const ngon = (n, rad, start, dy) => PP.range(n).map((k) => {
    const a = ((start + (360 / n) * k) * Math.PI) / 180;
    return [rad * Math.cos(a), rad * Math.sin(a) + (dy || 0)];
  });
  const star = () => PP.range(10).map((k) => {
    const a = ((-90 + 36 * k) * Math.PI) / 180, rr = k % 2 ? 0.42 : 1;
    return [rr * Math.cos(a), rr * Math.sin(a) + 0.05];
  });

  // sym: rotational symmetry in degrees (360 = none). axis: mirror axis angle in base frame (null = chiral).
  F.SH = {
    circle: { name: 'circle', sym: 1, axis: 0, sides: 0, path: null },
    square: { name: 'square', sym: 90, axis: 0, sides: 4, path: poly([[-0.8, -0.8], [0.8, -0.8], [0.8, 0.8], [-0.8, 0.8]]) },
    rect: { name: 'rectangle', sym: 180, axis: 0, sides: 4, path: poly([[-0.95, -0.55], [0.95, -0.55], [0.95, 0.55], [-0.95, 0.55]]) },
    diamond: { name: 'diamond', sym: 180, axis: 0, sides: 4, path: poly([[0, -1], [0.68, 0], [0, 1], [-0.68, 0]]) },
    trap: { name: 'trapezoid', sym: 360, axis: 90, sides: 4, path: poly([[-0.5, -0.6], [0.5, -0.6], [0.95, 0.6], [-0.95, 0.6]]) },
    triangle: { name: 'triangle', sym: 120, axis: 90, sides: 3, path: poly(ngon(3, 1, -90, 0.15)) },
    rtri: { name: 'right triangle', sym: 360, axis: 135, sides: 3, path: poly([[-0.8, -0.8], [-0.8, 0.8], [0.8, 0.8]]) },
    pentagon: { name: 'pentagon', sym: 72, axis: 90, sides: 5, path: poly(ngon(5, 0.95, -90, 0.06)) },
    hexagon: { name: 'hexagon', sym: 60, axis: 0, sides: 6, path: poly(ngon(6, 0.95, 0, 0)) },
    octagon: { name: 'octagon', sym: 45, axis: 0, sides: 8, path: poly(ngon(8, 0.95, 22.5, 0)) },
    star: { name: 'star', sym: 72, axis: 90, sides: 10, path: poly(star()) },
    cross: { name: 'cross', sym: 90, axis: 0, sides: 12, path: poly([[-0.3, -0.9], [0.3, -0.9], [0.3, -0.3], [0.9, -0.3], [0.9, 0.3], [0.3, 0.3], [0.3, 0.9], [-0.3, 0.9], [-0.3, 0.3], [-0.9, 0.3], [-0.9, -0.3], [-0.3, -0.3]]) },
    heart: { name: 'heart', sym: 360, axis: 90, sides: 0, path: [['M', 0, 0.88], ['C', -1.35, -0.05, -0.65, -1.1, 0, -0.42], ['C', 0.65, -1.1, 1.35, -0.05, 0, 0.88], ['Z']] },
    moon: { name: 'moon', sym: 360, axis: 0, sides: 0, path: [['M', 0.5333, -0.8459], ['A', 1, 1, 0, 1, 0, 0.5333, 0.8459], ['A', 0.85, 0.85, 0, 1, 1, 0.5333, -0.8459], ['Z']] },
    arrow: { name: 'arrow', sym: 360, axis: 0, sides: 7, path: poly([[-0.92, -0.26], [0.18, -0.26], [0.18, -0.62], [0.95, 0], [0.18, 0.62], [0.18, 0.26], [-0.92, 0.26]]) },
    pac: { name: 'pac-man', sym: 360, axis: 0, sides: 0, path: [['M', 0, 0], ['L', 0.819, -0.574], ['A', 1, 1, 0, 1, 0, 0.819, 0.574], ['Z']] },
    lshape: { name: 'L-shape', sym: 360, axis: null, sides: 6, path: poly([[-0.6, -0.9], [-0.08, -0.9], [-0.08, 0.38], [0.65, 0.38], [0.65, 0.9], [-0.6, 0.9]]) },
    flag: { name: 'flag', sym: 360, axis: null, sides: 0, path: [['M', -0.62, -0.92], ['L', -0.44, -0.92], ['L', -0.44, 0.92], ['L', -0.62, 0.92], ['Z'], ['M', -0.44, -0.92], ['L', 0.78, -0.52], ['L', -0.44, -0.12], ['Z']] },
  };
  F.ROT = ['arrow', 'pac', 'moon', 'flag', 'lshape', 'heart']; // visibly change when turned
  F.BASIC = ['circle', 'square', 'triangle', 'diamond', 'pentagon', 'hexagon', 'star', 'cross', 'heart'];
  F.POLY = ['triangle', 'square', 'pentagon', 'hexagon'];

  const rad = (d) => (d * Math.PI) / 180;
  const n2 = (v) => Math.round(v * 100) / 100;

  // transform a base path: flip (x→-x) in base frame, rotate r clockwise, scale s, translate cx,cy
  function tpath(cmds, cx, cy, s, r, fl) {
    const c = Math.cos(rad(r)), sn = Math.sin(rad(r));
    const tp = (x, y) => { if (fl) x = -x; return [n2(cx + s * (x * c - y * sn)), n2(cy + s * (x * sn + y * c))]; };
    let d = '';
    for (const cmd of cmds) {
      const t = cmd[0];
      if (t === 'Z') d += 'Z';
      else if (t === 'M' || t === 'L') d += t + tp(cmd[1], cmd[2]).join(' ') + ' ';
      else if (t === 'C') d += 'C' + [tp(cmd[1], cmd[2]), tp(cmd[3], cmd[4]), tp(cmd[5], cmd[6])].map((p) => p.join(' ')).join(' ') + ' ';
      else if (t === 'A') {
        const p = tp(cmd[6], cmd[7]);
        const sweep = fl ? 1 - cmd[5] : cmd[5];
        d += `A${n2(cmd[1] * s)} ${n2(cmd[2] * s)} 0 ${cmd[4]} ${sweep} ${p[0]} ${p[1]} `;
      }
    }
    return d.trim();
  }

  F.shape = function (s, cx, cy, size, rot, fill, fl, sw) {
    const def = F.SH[s];
    const stroke = `stroke="${INK}" stroke-width="${sw || 2.6}" stroke-linejoin="round"`;
    const f = F.FILL[fill] || fill;
    if (!def.path) return `<circle cx="${n2(cx)}" cy="${n2(cy)}" r="${n2(size * 0.92)}" fill="${f}" ${stroke}/>`;
    return `<path d="${tpath(def.path, cx, cy, size, rot || 0, fl)}" fill="${f}" ${stroke} fill-rule="evenodd"/>`;
  };

  const LAYOUT = {
    1: [[50, 50]],
    2: [[28, 50], [72, 50]],
    3: [[50, 28], [28, 71], [72, 71]],
    4: [[29, 29], [71, 29], [29, 71], [71, 71]],
    5: [[25, 25], [75, 25], [50, 50], [25, 75], [75, 75]],
    6: [[24, 32], [50, 32], [76, 32], [24, 68], [50, 68], [76, 68]],
  };
  const LR = { 1: 34, 2: 19, 3: 17, 4: 17, 5: 12.5, 6: 12.5 };
  const ZS = { 1: 0.5, 2: 0.74, 3: 1 };
  F.DOTS = [[14, 14], [50, 9], [86, 14], [91, 50], [86, 86], [50, 91], [14, 86], [9, 50]];

  // spec: {s, f, z, r, fl, n, in:{s,f}, dot, frame}
  F.inner = function (sp) {
    const n = sp.n || 1, R = LR[n] * ZS[sp.z || 3] * (sp.frame ? 0.82 : 1);
    let out = '';
    if (sp.frame) out += `<rect x="4" y="4" width="92" height="92" rx="6" fill="none" stroke="#c9cfdb" stroke-width="1.5"/>`;
    for (const [x, y] of LAYOUT[n]) {
      const cx = sp.frame ? 50 + (x - 50) * 0.8 : x, cy = sp.frame ? 50 + (y - 50) * 0.8 : y;
      out += F.shape(sp.s, cx, cy, R, sp.r, sp.f, sp.fl);
      if (sp.in) out += F.shape(sp.in.s, cx, cy, R * 0.38, sp.r, sp.f === 'b' ? 'w' : 'b', sp.fl, 2);
    }
    if (sp.dot !== undefined && sp.dot !== null) {
      const [x, y] = F.DOTS[sp.dot];
      out += `<circle cx="${x}" cy="${y}" r="5.2" fill="${INK}"/>`;
    }
    return out;
  };
  F.svg = (sp, cls) => `<svg viewBox="0 0 100 100" class="fig ${cls || ''}" aria-hidden="true">${typeof sp === 'string' ? sp : F.inner(sp)}</svg>`;
  F.blank = () => `<svg viewBox="0 0 100 100" class="fig q" aria-hidden="true"><text x="50" y="66" text-anchor="middle" font-size="46" font-weight="700" fill="${INK}" opacity=".35">?</text></svg>`;

  F.clone = (o) => JSON.parse(JSON.stringify(o));
  // screen-space mirror (left↔right)
  F.mirror = (sp) => { const o = F.clone(sp); o.r = -(o.r || 0); o.fl = !o.fl; return o; };
  const lcm = (a, b) => PP.lcm(a, b);
  F.canon = function (sp) {
    const o = F.clone(sp); const d = F.SH[o.s];
    o.r = o.r || 0; o.fl = !!o.fl; o.n = o.n || 1; o.z = o.z || 3;
    let sym = d.sym;
    if (o.in) sym = Math.min(360, lcm(sym, F.SH[o.in.s].sym));

  const WORDS = ['CAT', 'DOG', 'SUN', 'HAT', 'PEN', 'BUS', 'MAP', 'FISH', 'BIRD', 'FROG', 'CAKE', 'STAR', 'TREE', 'MOON', 'KITE', 'LAMP', 'ROSE', 'BOOK', 'DUCK', 'GAME', 'RAIN', 'LION', 'BEAR', 'WOLF', 'SHIP', 'CAMP', 'JUMP', 'NEST', 'GOLD', 'MILK'];

  const codeBox = (s) => `<span class="code">${s}</span>`;
  function codes(r, lvl) {
    const type = lvl === 1 ? r.pick(['shift1', 'sum']) : lvl === 2 ? r.pick(['shiftk', 'decode', 'reverse']) : r.pick(['subst', 'subst', 'positions', 'shiftrev']);

      explain: `<p>The sentence is: <b>${esc(s)}.</b></p><p>The ${ask === 'last' ? 'last' : ask === 'first' ? 'first' : PP.ord(idx + 1)} word is <b>${esc(shown[idx])}</b>.</p>` }, res);
  }

  PP.addChapter({ id: 'letter-series', group: 'verbal', name: 'Letter Series', exams: 'OLSAT · aptitude tests', gen: letterSeries,
    tip: 'Turn letters into numbers (A = 1, B = 2…) and look at the jumps. Write the alphabet at the top of your scrap paper.' });

    wrongs.push(num(inputs[2], 'That is the starting number, unchanged.'));

    const stem = `<div class="pairs">${inputs.map((x, i) => `<span class="pair">[ ${fmt(x)} → ${i < 2 ? fmt(outs[i]) : '<b class="qm">?</b>'} ]</span>`).join('')}</div>`;
    return numQ(r, 5, 'Find the rule that changes the first number into the second. Use it on the last pair.', stem, ans, wrongs,
      `<p>The rule is <b>${rule.t}</b>.</p><p class="work">${inputs.map((x, i) => `${fmt(x)} → ${fmt(outs[i])}`).join('&nbsp;&nbsp;·&nbsp;&nbsp;')}</p><p>Always test your rule on <i>both</i> example pairs before using it.</p>`);
  }

  // ================= NUMBER PUZZLES =================
  const SYM = ['▲', '●', '■', '◆', '★'];
  function puzzles(r, lvl) {
    const type = lvl === 1 ? r.pick(['bal', 'bal', 'sym1']) : lvl === 2 ? r.pick(['bal2', 'sym1', 'sym2']) : r.pick(['sym3', 'sym4', 'bal3']);
    if (type === 'bal' || type === 'bal2' || type === 'bal3') {
      const ops = type === 'bal' ? ['+', '−'] : ['+', '−', '×'];
      const rop = r.pick(ops), lop = r.pick(type === 'bal' ? ['+', '−'] : ['+', '−', '×', '÷']);
      let y = r.int(2, 12), z = r.int(1, 9);
      if (rop === '−' && z > y) [y, z] = [z, y];
      const R = rop === '+' ? y + z : rop === '−' ? y - z : y * z;
      const a = r.int(2, 9);
      let x; // ? lop a = R
      if (lop === '+') x = R - a; else if (lop === '−') x = R + a; else if (lop === '×') { if (R % a) throw new Error('x'); x = R / a; } else x = R * a;
      if (x < 0) throw new Error('neg');
      const inv = { '+': '−', '−': '+', '×': '÷', '÷': '×' }[lop];
      const wrongs = [num(R, `${fmt(R)} is the value of the right side. The ? still has to be worked out from it.`)];
      const wrongX = lop === '+' ? R + a : lop === '−' ? R - a : lop === '×' ? R * a : R / a;
      if (Number.isInteger(wrongX) && wrongX >= 0) wrongs.push(num(wrongX, `That does ${lop} ${a} instead of undoing it. To find ?, do the opposite: ${inv} ${a}.`));
      return numQ(r, 5, 'Which number should replace the ? so both sides are equal?', `<div class="eq">? ${lop} ${a} = ${y} ${rop} ${z}</div>`, x, wrongs,
        `<p>First work out the right side: ${y} ${rop} ${z} = <b>${R}</b>.</p><p>So ? ${lop} ${a} = ${R}. Undo it: ${R} ${inv} ${a} = <b>${fmt(x)}</b>.</p><p class="work">Check: ${fmt(x)} ${lop} ${a} = ${R} ✓</p>`);
    }
    const [A, B, C] = r.sample(SYM, 3);
    if (type === 'sym1') {
      const a = r.int(2, 12), b = r.int(1, 12);
      return numQ(r, 5, 'Each shape stands for a number. What number is the last shape?', `<div class="eqs"><div>${A} + ${A} = ${2 * a}</div><div>${A} + ${B} = ${a + b}</div><div>${B} = ?</div></div>`, b,
        [num(a, `That's ${A}, not ${B}.`), num(a + b, `That's the total of ${A} + ${B}.`), num(2 * a, 'That is the first total.')],
        `<p>${A} + ${A} = ${2 * a}, so ${A} = ${2 * a} ÷ 2 = <b>${a}</b>.</p><p>${A} + ${B} = ${a + b}, so ${B} = ${a + b} − ${a} = <b>${b}</b>.</p>`);
    }
    if (type === 'sym2') {
      const a = r.int(2, 9), k = r.int(2, 4), b = r.int(2, 12);
      return numQ(r, 5, 'Each shape stands for a number. What number is the last shape?', `<div class="eqs"><div>${A} × ${k} = ${a * k}</div><div>${B} − ${A} = ${b}</div><div>${B} = ?</div></div>`, a + b,
        [num(b - a >= 0 ? b - a : b + 2 * a, `${B} − ${A} = ${b} means ${B} is ${b} MORE than ${A}.`), num(a, `That is ${A}.`), num(a * k + b, `That adds ${b} to ${a * k}, but ${a * k} is ${A} × ${k}, not ${A}.`)],
        `<p>${A} × ${k} = ${a * k}, so ${A} = ${a * k} ÷ ${k} = <b>${a}</b>.</p><p>${B} − ${a} = ${b}, so ${B} = ${b} + ${a} = <b>${a + b}</b>.</p>`);
    }
    if (type === 'sym3') {
      const a = r.int(5, 20), b = r.int(1, a - 1);
      return numQ(r, 5, 'Each shape stands for a number. What number is the last shape?', `<div class="eqs"><div>${A} + ${B} = ${a + b}</div><div>${A} − ${B} = ${a - b}</div><div>${A} = ?</div></div>`, a,
        [num(b, `That is ${B}.`), num(a + b, 'That is the sum.'), num(a - b, 'That is the difference.')],
        `<p>Add the two equations: (${A} + ${B}) + (${A} − ${B}) = ${a + b} + ${a - b}, so two ${A}s make ${2 * a}.</p><p>${A} = ${2 * a} ÷ 2 = <b>${a}</b>. (And ${B} = ${b}.)</p>`);
    }
    // sym4: chain of three
    const c = r.int(2, 9), d = r.int(2, 6), e = r.int(2, 4);
    const a = c + d, b = e * c;
    return numQ(r, 5, 'Each shape stands for a number. What is the value of the question?', `<div class="eqs"><div>${C} + ${C} + ${C} = ${3 * c}</div><div>${A} = ${C} + ${d}</div><div>${B} = ${C} × ${e}</div><div>${A} + ${B} = ?</div></div>`, a + b,
      [num(a, `That is just ${A}.`), num(b, `That is just ${B}.`), num(c + d + e, 'Those numbers were added instead of using the rules.'), num(a * b, 'That multiplies instead of adding.')],
      `<p>${C} = ${3 * c} ÷ 3 = <b>${c}</b>.</p><p>${A} = ${c} + ${d} = <b>${a}</b>. &nbsp;${B} = ${c} × ${e} = <b>${b}</b>.</p><p>${A} + ${B} = ${a} + ${b} = <b>${a + b}</b>.</p>`);
  }

  // ================= NUMBER GRIDS (OLSAT number matrix) =================
  const GRULES = [
    { f: (a, b) => a + b, t: 'the first number plus the second', lv: 1 },
    { f: (a, b) => a - b, t: 'the first number minus the second', lv: 1 },
    { f: (a, b) => a * b, t: 'the first number times the second', lv: 2 },
    { f: (a, b) => 2 * a + b, t: 'double the first number, then add the second', lv: 3 },
    { f: (a, b) => a + 2 * b, t: 'the first number plus double the second', lv: 3 },
    { f: (a, b) => (a + b) * 2, t: 'add the two numbers, then double', lv: 3 },
    { f: (a, b) => a * b + 1, t: 'multiply the two numbers, then add 1', lv: 3 },
    { f: (a, b) => a * b - a, t: 'multiply the two numbers, then subtract the first', lv: 3 },
    { f: (a, b) => a * a + b, t: 'multiply the first by itself, then add the second', lv: 3 },
    { f: (a, b) => (a % b ? NaN : a / b), t: 'the first number divided by the second', lv: 2 },
  ];
  const gridHtml = (rows, cols) => `<div class="ngrid" style="--cols:${cols}">${rows.flat().map((v) => v === null ? '<span class="q">?</span>' : `<span>${fmt(v)}</span>`).join('')}</div>`;
  function grids(r, lvl) {
    const t = lvl === 1 ? r.pick(['row', 'pyr']) : lvl === 2 ? r.pick(['row', 'pyr', 'magic']) : r.pick(['row', 'pyr', 'magic']);
    if (t === 'row') {
      const pool = GRULES.filter((g) => (lvl === 3 ? g.lv >= 2 : g.lv <= lvl));
      const g = r.pick(pool);
      const rows = [];
      for (let i = 0; i < 3; i++) {
        let a = r.int(2, lvl === 1 ? 20 : 12), b = r.int(1, lvl === 1 ? 15 : 9);
        if (g.t.includes('minus') || g.t.includes('divided')) { if (b >= a) [a, b] = [b + a, b]; }
        if (g.t.includes('divided')) { b = Math.max(2, b); a = b * r.int(2, 9); }
        const c = g.f(a, b);
        if (!Number.isInteger(c) || c < 0) throw new Error('bad');
        rows.push([a, b, c]);
      }
      const ans = rows[2][2];
      for (const h of GRULES) if (h.f(rows[0][0], rows[0][1]) === rows[0][2] && h.f(rows[1][0], rows[1][1]) === rows[1][2] && h.f(rows[2][0], rows[2][1]) !== ans) throw new Error('ambiguous');
      const shown = rows.map((rw, i) => (i === 2 ? [rw[0], rw[1], null] : rw));
      const wrongs = GRULES.filter((h) => h !== g).map((h) => h.f(rows[2][0], rows[2][1])).filter((v) => Number.isInteger(v) && v >= 0).map((v) => num(v, 'That uses a different rule. Test it on the first two rows: it doesn’t work there.'));
      return numQ(r, 5, 'The numbers in each row follow the same rule. Which number replaces the ?', gridHtml(shown, 3), ans, wrongs,
        `<p>In every row, the third number is <b>${g.t}</b>.</p><p class="work">${rows.map((rw) => `${rw[0]}, ${rw[1]} → ${rw[2]}`).join('&nbsp;&nbsp;·&nbsp;&nbsp;')}</p>`);
    }
    if (t === 'pyr') {
      const n = lvl === 1 ? 3 : 4;
      const base = PP.range(n).map(() => r.int(1, lvl === 1 ? 9 : 12));
      const rows = [base];
      while (rows[0].length > 1) { const b = rows[0]; rows.unshift(b.slice(1).map((v, i) => b[i] + v)); }
      // rows[0] = top. choose a hidden cell; at lvl3 hide a base cell (needs subtraction)
      let ri, ci;
      if (lvl === 3) { ri = n - 1; ci = r.int(0, n - 1); } else if (lvl === 2 && r.chance(0.5)) { ri = n - 2; ci = r.int(0, n - 2); } else { ri = 0; ci = 0; }
      const ans = rows[ri][ci];
      // what must be shown for solvability: show everything except hidden (and at L3 also hide the top to force reasoning)
      const shown = rows.map((rw, i) => rw.map((v, j) => (i === ri && j === ci ? null : v)));
      let why;
      if (ri === n - 1) {
        const pj = ci > 0 ? ci - 1 : ci; const above = rows[n - 2][pj]; const sib = ci > 0 ? rows[n - 1][ci - 1] : rows[n - 1][ci + 1];
        why = `The block above it is ${above}, and its neighbour is ${sib}. So the missing number is ${above} − ${sib} = <b>${ans}</b>.`;
      } else {
        why = `The two blocks under it are ${rows[ri + 1][ci]} and ${rows[ri + 1][ci + 1]}, so it is ${rows[ri + 1][ci]} + ${rows[ri + 1][ci + 1]} = <b>${ans}</b>.`;
      }
      const html = `<div class="pyr">${shown.map((rw) => `<div>${rw.map((v) => (v === null ? '<span class="q">?</span>' : `<span>${v}</span>`)).join('')}</div>`).join('')}</div>`;
      const wrongs = [num(ri === n - 1 ? ans + 2 * rows[n - 1][ci === 0 ? 1 : ci - 1] : ans - 1, 'Each block equals the two blocks underneath it added together.')];
      if (ri === n - 1) { const pj = ci > 0 ? ci - 1 : ci; wrongs.push(num(rows[n - 2][pj] + (ci > 0 ? rows[n - 1][ci - 1] : rows[n - 1][ci + 1]), 'That adds when you need to subtract: the missing block is underneath.')); }
      return numQ(r, 5, 'In this number wall, each block is the sum of the two blocks right under it. What number goes in the ? block?', html, ans, wrongs, `<p>${why}</p>`);
    }
    // magic square
    const lo = [[2, 7, 6], [9, 5, 1], [4, 3, 8]];
    let sq = lo.map((rw) => rw.slice());
    for (let k = r.int(0, 3); k > 0; k--) sq = sq[0].map((_, j) => sq.map((rw) => rw[j]).reverse());
    if (r.chance(0.5)) sq = sq.map((rw) => rw.slice().reverse());
    const m = r.int(1, 3), add = r.int(0, 10);
    sq = sq.map((rw) => rw.map((v) => v * m + add));
    const S = PP.sum(sq[0]);
    const cells = PP.range(9);
    const hideN = lvl === 2 ? 2 : 4;
    const lines = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
    for (let tries = 0; tries < 50; tries++) {
      const hidden = r.sample(cells, hideN);
      if (!lines.some((l) => l.every((c) => !hidden.includes(c)))) continue;
      // propagate
      const known = new Set(cells.filter((c) => !hidden.includes(c)));
      const steps = [];
      let progress = true;
      while (progress) {
        progress = false;
        for (const l of lines) {
          const unk = l.filter((c) => !known.has(c));
          if (unk.length === 1) { known.add(unk[0]); steps.push([l, unk[0]]); progress = true; }
        }
      }
      if (known.size < 9) continue;
      const target = lvl === 3 ? steps[steps.length - 1][1] : steps[0][1];
      const ans = sq[Math.floor(target / 3)][target % 3];
      const shown = sq.map((rw, i) => rw.map((v, j) => (hidden.includes(i * 3 + j) ? (i * 3 + j === target ? null : '') : v)));
      const html = `<div class="ngrid magic" style="--cols:3">${shown.flat().map((v) => (v === null ? '<span class="q">?</span>' : v === '' ? '<span class="blank"></span>' : `<span>${v}</span>`)).join('')}</div>`;
      const full = lines.find((l) => l.every((c) => !hidden.includes(c)));
      return numQ(r, 5, 'This is a magic square: every row, column and diagonal adds up to the same total. What number replaces the ?', html, ans,
        [num(S, 'That is the magic total, not the missing number.'), num(ans + m, 'Close. Add up the line again.'), num(ans - m, 'Close. Add up the line again.')],
        `<p>A full line tells you the magic total: ${full.map((c) => sq[Math.floor(c / 3)][c % 3]).join(' + ')} = <b>${S}</b>.</p><p>${lvl === 3 ? 'Fill in the empty squares one line at a time, using lines that are missing only one number. ' : ''}The line through the ? gives ${S} minus the other two numbers = <b>${ans}</b>.</p>`);
    }
    throw new Error('magic failed');
  }

  // ================= WORD PROBLEMS (ISEE QR / OLSAT arithmetic reasoning) =================
  const ITEMS = [['sticker', 'stickers'], ['marble', 'marbles'], ['card', 'cards'], ['pencil', 'pencils'], ['cookie', 'cookies'], ['shell', 'shells'], ['stamp', 'stamps']];
  const time = (m) => { m = ((m % 1440) + 1440) % 1440; const h = Math.floor(m / 60), mm = m % 60; return `${h % 12 === 0 ? 12 : h % 12}:${String(mm).padStart(2, '0')} ${h < 12 ? 'a.m.' : 'p.m.'}`; };
  const WP = [
    { lv: 1, f: (r) => { const [n] = PP.names(r, 1); const [it, its] = r.pick(ITEMS); const a = r.int(20, 60), b = r.int(3, 6), c = r.int(4, 10), d = r.int(5, 25); const ans = a + b * c - d; return { text: `${n} has ${a} ${its}. ${n} buys ${b} packs with ${c} ${its} in each pack, then gives ${d} ${its} to a friend. How many ${its} does ${n} have now?`, ans, wrongs: [num(a + b * c, `That forgets the ${d} given away.`), num(a + b + c - d, `${b} packs of ${c} is ${b} × ${c}, not ${b} + ${c}.`), num(a - b * c + d, 'The packs are added and the gift is taken away.')], ex: `${a} + (${b} × ${c}) − ${d} = ${a} + ${b * c} − ${d} = <b>${ans}</b>` }; } },
    { lv: 1, f: (r) => { const [n] = PP.names(r, 1); const k = r.int(3, 8), each = r.int(4, 9), left = r.int(1, k - 1); const tot = k * each + left; return { text: `${n} shares ${tot} cookies equally among ${k} friends and keeps the leftovers. How many cookies does ${n} keep?`, ans: left, wrongs: [num(each, `${each} is how many each friend gets.`), num(k, 'That is the number of friends.'), num(left + k, 'Divide first, then find what is left over.')], ex: `${tot} ÷ ${k} = ${each} with <b>${left}</b> left over (${k} × ${each} = ${k * each}, and ${tot} − ${k * each} = ${left}).` }; } },
    { lv: 1, f: (r) => { const [n] = PP.names(r, 1); const st = r.int(14, 34) * 30 + r.pick([0, 15, 45]), d = r.int(2, 9) * 5 + r.int(1, 2) * 60 * r.int(0, 1); const ans = st + d; return { text: `${n} starts reading at ${time(st)} and reads for ${d >= 60 ? `${Math.floor(d / 60)} hour${d >= 120 ? 's' : ''} ${d % 60 ? `and ${d % 60} minutes` : ''}` : `${d} minutes`}. What time does ${n} stop?`, ans, opt: time, wrongs: [{ h: time(ans + 60), k: ans + 60, why: 'That is one hour too late.' }, { h: time(ans - 10), k: ans - 10, why: 'Count the minutes again.' }, { h: time(st + (d % 60) * 2), k: st + (d % 60) * 2, why: 'Count the minutes again.' }, { h: time(ans + 10), k: ans + 10, why: 'Count the minutes again.' }, { h: time(ans - 60), k: ans - 60, why: 'That is one hour too early.' }], ex: `Start at ${time(st)} and add ${d} minutes → <b>${time(ans)}</b>.` }; } },
    { lv: 2, f: (r) => { const [n] = PP.names(r, 1); const k = r.int(3, 6), p = r.int(35, 95) * 5, bill = Math.ceil((k * p) / 1000 + 0.01) * 1000; const ans = bill - k * p; return { text: `${n} buys ${k} notebooks that cost ${PP.money(p)} each and pays with ${PP.money(bill).replace('.00', '')}. How much change should ${n} get?`, ans, opt: PP.money, wrongs: [{ h: PP.money(bill - p), k: bill - p, why: `That's the change for only one notebook. ${n} bought ${k}.` }, { h: PP.money(k * p), k: k * p, why: 'That is the total cost, not the change.' }, { h: PP.money(ans + 100), k: ans + 100, why: 'Recheck the subtraction.' }, { h: PP.money(ans - 50), k: ans - 50, why: 'Recheck the subtraction.' }, { h: PP.money(ans + 50), k: ans + 50, why: 'Recheck the subtraction.' }], ex: `Cost: ${k} × ${PP.money(p)} = ${PP.money(k * p)}. Change: ${PP.money(bill)} − ${PP.money(k * p)} = <b>${PP.money(ans)}</b>.` }; } },
    { lv: 2, f: (r) => { const [n] = PP.names(r, 1); const p = r.int(6, 15), N = p * r.int(8, 20) + r.int(1, p - 1); const ans = Math.ceil(N / p); return { text: `A book has ${N} pages. ${n} reads ${p} pages every day. How many days will it take ${n} to finish the book?`, ans, wrongs: [num(Math.floor(N / p), `After ${Math.floor(N / p)} days there are still ${N - p * Math.floor(N / p)} pages left, so ${n} needs one more day.`)], ex: `${N} ÷ ${p} = ${Math.floor(N / p)} remainder ${N % p}. The leftover pages need one more day: <b>${ans}</b> days.` }; } },
    { lv: 2, f: (r) => { const [a, b] = PP.names(r, 2); const ba = r.int(5, 10), k = r.int(3, 9), y = r.int(2, 8); const aa = ba + k; const ans = aa + y + ba + y; return { text: `${a} is ${k} years older than ${b}. ${b} is ${ba} now. What will their ages add up to in ${y} years?`, ans, wrongs: [num(aa + ba, `That's their ages now. Both of them get ${y} years older.`), num(aa + ba + y, `Both children get ${y} years older, so add ${y} twice.`), num(aa + y, `That is just ${a}'s age then.`)], ex: `${a} is ${ba} + ${k} = ${aa}. In ${y} years: ${aa + y} + ${ba + y} = <b>${ans}</b>.` }; } },
    { lv: 2, f: (r) => { const d = r.pick([3, 4, 5, 6, 8]), nn = r.int(1, d - 1), tot = d * r.int(4, 10); if (PP.gcd(nn, d) !== 1) throw new Error('x'); const part = (tot / d) * nn; const ans = tot - part; return { text: `There are ${tot} students in a club. ${PP.frac(nn, d)} of them play chess. How many students do <b>not</b> play chess?`, ans, wrongs: [num(part, 'That is how many DO play chess.'), num(tot / d, `That is ${PP.frac(1, d)} of the club.`), num(tot - tot / d, `That takes away only ${PP.frac(1, d)}.`)], ex: `${PP.frac(1, d)} of ${tot} is ${tot / d}, so ${PP.frac(nn, d)} is ${tot / d} × ${nn} = ${part}. Not chess: ${tot} − ${part} = <b>${ans}</b>.` }; } },
    { lv: 2, f: (r) => { const l = r.int(5, 15), w = r.int(3, l - 1), c = r.int(2, 6); const per = 2 * (l + w); const ans = per * c; return { text: `A rectangular garden is ${l} m long and ${w} m wide. Fencing costs $${c} per metre. How much does it cost to put a fence all the way around?`, ans, opt: (v) => '$' + v, wrongs: [{ h: '$' + l * w * c, k: l * w * c, why: 'That uses the area. A fence goes around the edge (perimeter).' }, { h: '$' + (l + w) * c, k: (l + w) * c, why: 'That only covers two sides. A rectangle has four.' }, { h: '$' + per, k: per, why: 'That is the perimeter in metres. Now multiply by the cost.' }, { h: '$' + (ans + c * 2), k: ans + c * 2, why: 'Recheck the perimeter.' }], ex: `Perimeter = ${l} + ${w} + ${l} + ${w} = ${per} m. Cost = ${per} × $${c} = <b>$${ans}</b>.` }; } },

  function startSession(o) { Q = Object.assign({ i: 0, answers: [], qs: [], streak: 0, best: 0, xp: 0, start: Date.now(), qStart: Date.now() }, o); view = { name: 'quiz' }; }
  function startSet(chId, i) { const ch = PP.byId[chId]; startSession({ kind: 'set', ch: chId, set: i, refs: PP.setRefs(ch, i).slice(), title: `${ch.name} · Set ${i + 1}`, token: chId + '.' + (i + 1) }); }
  function startEndless(chId, lvl) { const ch = PP.byId[chId]; startSession({ kind: 'endless', ch: chId, lvl, refs: [], title: `${ch.name} · Endless (${PP.LEVELS[lvl]})`, token: chId }); }
  function startDaily() { startSession({ kind: 'daily', refs: PP.dailyRefs(today()), title: `Daily 10 · ${new Date().toLocaleDateString(undefined, { month: 'long', day: 'numeric' })}`, token: 'daily' }); }
  function startMix(i) { startSession({ kind: 'mix', set: i, refs: PP.mixRefs(i).slice(), title: `Mixed Climb · Set ${i + 1}`, token: 'mix.' + (i + 1) }); }
  // weak or barely-tried chapters come up more often; each chapter's level follows his accuracy there
  function startSmart() {
    const w = (id) => { const st = S.stats[id]; return !st || st[1] < 6 ? 3 : 1 + 4 * (1 - st[0] / st[1]); };
    const pick = (chs, k, r) => { const pool = chs.slice(), out = []; while (out.length < k && pool.length) { let x = r() * PP.sum(pool.map(w)), i = 0; for (; i < pool.length - 1; i++) { x -= w(pool[i]); if (x <= 0) break; } out.push(pool.splice(i, 1)[0]); } return out; };
    const lv = (slot, id) => { const st = S.stats[id]; if (!st || st[1] < 8) return 2; const a = st[0] / st[1]; return a >= 0.85 ? 3 : a >= 0.6 ? 2 : 1; };

  }
  function startMistakes() { const refs = Object.values(S.mistakes).sort((a, b) => a.t - b.t).slice(0, 10).map((m) => ({ ch: m.ch, seed: m.seed, lvl: m.lvl })); if (!refs.length) return; startSession({ kind: 'mistakes', refs, title: 'Fix my mistakes', token: 'mistakes' }); }
  function nextEndlessRef() {

    d.timeMs += t; S.timeMs += t;

        <li><b>Math Kangaroo and the Waterloo Gauss contest</b>: multi-step logic, counting and “trick” problems.</li>
      </ul>
      <p>Most number, shape and logic questions are built by a program from a rule, so the answer is always checked and the explanation shows the rule. Word questions are written by hand.</p>
      <p><b>Difficulty:</b> sets 1–3 are Warm-up (about grade 3–4), 4–7 Challenge (grade 4–5), and 8–10 Expert (grade 5–7).</p>
      <p><b>Free official practice worth knowing about:</b> past contests from the <a href="https://cemc.uwaterloo.ca/contests" target="_blank" rel="noopener">University of Waterloo CEMC</a>, and sample problems from <a href="https://mathkangaroo.org" target="_blank" rel="noopener">Math Kangaroo</a>. Test publishers: <a href="https://www.riversideinsights.com" target="_blank" rel="noopener">Riverside Insights</a> (CogAT), <a href="https://www.nelson.com" target="_blank" rel="noopener">Nelson</a> (CCAT), <a href="https://www.pearsonassessments.com" target="_blank" rel="noopener">Pearson</a> (OLSAT, NNAT), <a href="https://www.erblearn.org" target="_blank" rel="noopener">ERB</a> (ISEE).</p>
      <h2 style="margin-top:28px">Privacy</h2>
      <p>Puzzle Peak has no accounts, no ads and no tracking. Everything is saved in the browser on each device. Your name never leaves the device.</p>
      <p>If a parent turns on <b>Sync between devices</b>, a compressed copy of the progress (stars, scores, XP, saved mistakes and test results) is stored online under a random family code. The code itself isn’t stored, only a scrambled fingerprint of it. Nothing else is kept: no names, emails, locations or device details. A parent can delete the online copy at any time from Profile.</p>
      <p class="small muted">Puzzle Peak is an independent practice tool. It is not affiliated with or endorsed by any test publisher. Scores here are practice scores, not official percentiles.</p>
    </main>`;
  }

  function render() {
    const V = { home: vHome, chapter: vChapter, quiz: vQuiz, result: vResult, testIntro: vTestIntro, test: vTest, testResult: vTestResult, mistakes: vMistakes, progress: vProgress, trophies: vTrophies, profile: vProfile, about: vAbout, mix: vMix, locked: vLocked }[view.name] || vHome;
    app.innerHTML = (['quiz', 'test'].includes(view.name) ? '' : topbar()) + V();
  }

  // ================= events =================
  app.addEventListener('click', (e) => {
    const g = e.target.closest('[data-go]');
    if (g) { e.preventDefault(); if (view.name === 'test' && T && !g.dataset.go.startsWith('test-')) { /* leaving a test */ clearInterval(timer); T = null; } go(g.dataset.go); return; }
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    if (act === 'pick') answer(+b.dataset.i, b);
    else if (act === 'next') next();
    else if (act === 'finish') finish();
    else if (act === 'quit') { const back = Q.kind === 'mix' ? 'mix' : (Q.kind === 'set' || Q.kind === 'endless') && !locked() ? Q.ch : Q.kind === 'mistakes' ? 'mistakes' : 'home'; Q = null; go(back); }
    else if (act === 'again') { if (Q.kind === 'mix') startMix(Q.set); else startSet(Q.ch, Q.set); render(); window.scrollTo(0, 0); }
    else if (act === 'fixnow') { const refs = Q.answers.map((a, i) => (a && !a.ok ? Q.refs[i] : null)).filter(Boolean); startSession({ kind: 'mistakes', refs, title: 'Retry missed questions', token: 'mistakes' }); render(); window.scrollTo(0, 0); }
    else if (act === 'mistakes') { startMistakes(); render(); window.scrollTo(0, 0); }
    else if (act === 'lvl') { view.lvl = +b.dataset.l; render(); }
    else if (act === 'endless') { const ch = PP.byId[view.ch]; startEndless(view.ch, view.lvl === undefined ? (ch.bank ? 0 : 2) : view.lvl); render(); window.scrollTo(0, 0); }
    else if (act === 'sound') { S.sound = !S.sound; save(); render(); }
    else if (act === 'form') { view.form = +b.dataset.f; render(); }
    else if (act === 'starttest') startTest(view.t, view.form || 0);
    else if (act === 'tpick') { const s = T.secs[T.si]; s.picks[T.i] = +b.dataset.i; render(); }
    else if (act === 'tnext') testMove(T.i + 1);
    else if (act === 'tprev') testMove(T.i - 1);
    else if (act === 'tjump') testMove(+b.dataset.i);
    else if (act === 'flag') { const s = T.secs[T.si]; s.flags[T.i] = !s.flags[T.i]; render(); }
    else if (act === 'pause') { T.paused = !T.paused; render(); }
    else if (act === 'askquit') { T.quit = true; render(); window.scrollTo(0, 0); }
    else if (act === 'noquit') { T.quit = false; render(); }
    else if (act === 'doquit') { const id = T.tid; clearInterval(timer); T = null; go('test-' + id); }
    else if (act === 'askend') { T.confirm = true; render(); }
    else if (act === 'cancelend') { T.confirm = false; render(); }
    else if (act === 'endsec') { testMove(T.i); endSection(false); }
    else if (act === 'nextsec') { T.si = T.breakFor; T.breakFor = undefined; T.i = 0; T.qStart = Date.now(); render(); window.scrollTo(0, 0); }
    else if (act === 'rw') { view.onlyWrong = b.dataset.v === '1'; render(); }
    else if (act === 'askreset') { view.reset = true; render(); }
    else if (act === 'noreset') { view.reset = false; render(); }
    else if (act === 'setpin') { const pin = document.getElementById('pp-pin').value.trim(); if (!/^\d{4,8}$/.test(pin)) { view.pmsg = 'Use 4 to 8 digits.'; render(); return; } S.parent = { pin: pinHash(pin), lock: document.getElementById('pp-lock').checked }; view.parentOk = true; view.pmsg = 'Saved.'; save(); render(); }
    else if (act === 'unlockparent') { if (pinHash(document.getElementById('pp-pin-in').value.trim()) === S.parent.pin) { view.parentOk = true; view.pmsg = ''; } else view.pmsg = 'That PIN doesn’t match.'; render(); }
    else if (act === 'savelock') { S.parent.lock = document.getElementById('pp-lock').checked; view.pmsg = 'Saved.'; save(); render(); }
    else if (act === 'droppin') { S.parent = { pin: '', lock: false }; view.parentOk = false; view.pmsg = 'PIN removed. Every chapter is open.'; save(); render(); }
    else if (act === 'sync-on') { C = { key: newFamilyCode() }; Cloud.saveCfg(); view.syncMsg = 'Sync is on. Enter the family code on his other devices.'; render(); Cloud.sync(); }
    else if (act === 'sync-join') { const k = document.getElementById('pp-key-in').value.trim().toLowerCase().replace(/\s+/g, ''); if (!KEY_RE.test(k)) { view.syncMsg = 'That doesn’t look like a family code. It starts with “peak-” and has four groups of four letters or numbers.'; render(); return; } C = { key: k }; Cloud.saveCfg(); view.syncMsg = 'Joined. Progress from all devices with this code is being combined.'; render(); Cloud.sync(); }
    else if (act === 'sync-now') Cloud.sync();
    else if (act === 'sync-copy') navigator.clipboard.writeText(C.key).then(() => toast('<div>Family code copied.</div>'), () => toast(`<div>${esc(C.key)}</div>`));
    else if (act === 'sync-off') { C = {}; Cloud.saveCfg(); view.syncMsg = 'Sync is off on this device. Its progress stays here.'; render(); }
    else if (act === 'sync-askdel') { view.askDel = true; render(); }
    else if (act === 'sync-nodel') { view.askDel = false; render(); }
    else if (act === 'sync-del') { Cloud.call('/v1/delete', { key: C.key }).then((r) => { view.askDel = false; if (r.ok) { C = {}; Cloud.saveCfg(); view.syncMsg = 'The online copy is deleted and sync is off on this device.'; } else view.syncMsg = 'Couldn’t delete it just now. Check the internet connection and try again.'; render(); }); }
    else if (act === 'file-save') saveBackupFile();
    else if (act === 'mkcode') { packState().then((c) => { view.code = c; view.codeMsg = ''; render(); }); }
    else if (act === 'copycode') { const ta = document.getElementById('pp-code-out'); navigator.clipboard.writeText(view.code).then(() => toast('<div>Code copied.</div>'), () => { ta.focus(); ta.select(); }); }
    else if (act === 'usecode') { unpackState(document.getElementById('pp-code-in').value).then((inc) => { S = merge(S, inc); save(); view.codeMsg = `Added! You now have ${S.answered} answers and ${Object.keys(S.badges).length} badges here.`; render(); }, () => { view.codeMsg = 'That code didn’t work. Copy the whole code and try again.'; render(); }); }
    else if (act === 'doreset') { const keepName = S.name, keepParent = S.parent; S = blank(); S.name = keepName; S.parent = keepParent; S.epoch = { id: rid(), t: Date.now() }; save(); Cloud.sync(); view.reset = false; toast('<div>Progress erased.</div>'); render(); }
  });
  app.addEventListener('change', (e) => {
    if (e.target.id !== 'pp-file' || !e.target.files[0]) return;
    e.target.files[0].text().then((txt) => unpackState(JSON.parse(txt).code)).then((inc) => { S = merge(S, inc); save(); view.codeMsg = `Backup loaded. You now have ${S.answered} answers and ${Object.keys(S.badges).length} badges here.`; render(); Cloud.sync(); }, () => { view.codeMsg = 'That file isn’t a Puzzle Peak backup.'; render(); });
  });
  async function saveBackupFile() {
    const code = await packState();
    const name = `puzzle-peak-backup-${today()}.json`;
    const blob = new Blob([JSON.stringify({ app: 'puzzle-peak', saved: new Date().toISOString(), code })], { type: 'application/json' });
    const file = new File([blob], name, { type: 'application/json' });
    try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Puzzle Peak backup' }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - Cloud.lastTry > 60000) Cloud.sync(); });
  window.addEventListener('online', () => Cloud.sync());
  setInterval(() => { if (document.visibilityState === 'visible' && Date.now() - Cloud.lastTry > 4 * 60000) Cloud.sync(); }, 60000);
  app.addEventListener('submit', (e) => {
    const f = e.target.closest('[data-form="profile"]');
    if (!f) return;
    e.preventDefault();
    S.name = document.getElementById('pp-name').value.trim().slice(0, 24);
    S.sound = document.getElementById('pp-sound').checked;
    save(); toast('<div>Saved.</div>'); go('home');
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.matches && e.target.matches('input, textarea')) return;
    const k = e.key.toLowerCase();
    const idx = '12345'.indexOf(k) >= 0 ? '12345'.indexOf(k) : 'abcde'.indexOf(k);
    if (view.name === 'quiz' && Q) {
      const q = qAt(Q, Q.i);
      if (!Q.answers[Q.i] && idx >= 0 && idx < q.opts.length) { e.preventDefault(); answer(idx); }
      else if (Q.answers[Q.i] && (k === 'arrowright' || (k === 'enter' && !(document.activeElement && document.activeElement.matches('button, summary, a'))))) { e.preventDefault(); next(); }
    } else if (view.name === 'test' && T && !T.paused && T.breakFor === undefined) {
      const q = tq(T.si, T.i);
      if (idx >= 0 && idx < q.opts.length) { T.secs[T.si].picks[T.i] = idx; render(); }
      else if (k === 'arrowright') testMove(T.i + 1);
      else if (k === 'arrowleft') testMove(T.i - 1);
    }
  });

  // keep an in-progress quiz or test alive across live updates of the page
  try {
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ token, view, Q: Q && Object.assign({}, Q, { qs: [] }), T: T && Object.assign({}, T, { secs: T.secs.map((s) => Object.assign({}, s, { qs: [] })) }) }));
  } catch (e) { /* not in a viewer */ }

  function start(data) {
    document.body.insertAdjacentHTML('afterbegin', PP.fig.DEFS);
    if (data && data.view) {
      token = data.token || ''; view = data.view; Q = data.Q || null; T = data.T || null;
      if (T && view.name === 'test') { clearInterval(timer); timer = setInterval(tick, 1000); }
      render();
    } else route(location.hash.slice(1));
    Sync.init();
    Cloud.sync();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* not supported */ }
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
